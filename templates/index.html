<table class="table table-striped">
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Shares</th>
            <th>Price</th>
            <th>TOTAL</th>
        </tr>
    </thead>
    <tbody>
        {% for stock in stocks %}
            <tr>
                <td>{{ stock.symbol }}</td>
                <td>{{ stock.total_shares }}</td>
                <td>{{ stock.price | usd }}</td>
                <td>{{ stock.total | usd }}</td>
            </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">Cash</td>
            <td>{{ cash | usd }}</td>
        </tr>
        <tr>
            <td colspan="3"><strong>Grand Total</strong></td>
            <td><strong>{{ total_value | usd }}</strong></td>
        </tr>
    </tfoot>
</table>
